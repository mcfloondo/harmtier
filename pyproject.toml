[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfloondo-harmtier"
version = "0.1.0"
description = "按结构键把条目聚类，标出有害内容的分级上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mcfloondo" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mcfloondo.github.io"
Repository = "https://github.com/mcfloondo/harmtier"
Issues = "https://github.com/mcfloondo/harmtier/issues"

[project.scripts]
harmtier = "harmtier:main"

[tool.setuptools]
py-modules = ["harmtier"]
